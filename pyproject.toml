[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "devcontext"
version = "0.1.0"
description = "DevContext — MCP server and CLI for providing AI coding agents with live production context."
readme = "README.md"
authors = [
    { name = "DevContext Team" }
]
license = "MIT"
dependencies = [
    "mcp>=1.0.0",
    "groq>=0.11.0",
]
requires-python = ">=3.10"

[tool.setuptools]
py-modules = ["cli", "tools", "server", "extraction", "parser"]

[project.scripts]
devcontext = "cli:main"
